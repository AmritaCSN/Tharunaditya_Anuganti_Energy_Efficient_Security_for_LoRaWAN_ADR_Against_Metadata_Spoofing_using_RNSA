name: ADR-Secure CI

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main ]

jobs:
  lint-python:
    name: Lint Python Scripts
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          pip install flake8 matplotlib numpy

      - name: Lint scripts with flake8
        run: |
          # Stop build on critical errors (E9: syntax, F63: assertion errors, F7: undefined, F82: undefined names)
          flake8 scripts/ --count --select=E9,F63,F7,F82 --show-source --statistics
          # Warnings only (non-blocking)
          flake8 scripts/ --count --exit-zero --max-complexity=15 --max-line-length=120 --statistics

  validate-ini-configs:
    name: Validate INI Config Syntax
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Validate INI configs (basic syntax check)
        run: |
          python - <<'EOF'
          import glob, sys, re
          ini_files = glob.glob("flora/simulations/examples/*.ini")
          errors = []
          for f in ini_files:
              with open(f) as fh:
                  content = fh.read()
              # Check for double-declared iteration variables (known bug pattern)
              matches = re.findall(r'\$\{(\w+)\s*=', content)
              seen = set()
              for m in matches:
                  if m in seen:
                      errors.append(f"{f}: variable '{m}' declared twice")
                  seen.add(m)
          if errors:
              print("INI config errors found:")
              for e in errors:
                  print(f"  ERROR: {e}")
              sys.exit(1)
          print(f"Validated {len(ini_files)} INI files — OK")
          EOF

  validate-paper:
    name: Check LaTeX Paper Structure
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Check paper/main.tex exists and has required sections
        run: |
          python - <<'EOF'
          import sys
          with open("paper/main.tex") as f:
              tex = f.read()
          required = [
              r"\section{Introduction}",
              r"\section{Background}",
              r"\section{Threat Model}",
              r"\section{ADR-Secure Design}",
              r"\section{Simulation Setup}",
              r"\section{Results}",
              r"\section{Conclusion}",
          ]
          missing = [s for s in required if s not in tex]
          if missing:
              print("Missing sections in paper/main.tex:")
              for m in missing:
                  print(f"  {m}")
              sys.exit(1)
          print("All required paper sections found — OK")
          EOF

  readme-check:
    name: README Quality Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check README has key sections
        run: |
          python - <<'EOF'
          import sys
          with open("README.md") as f:
              content = f.read()
          required_headings = ["Quick Start", "Core Modifications", "Experiment Configurations", "Citation"]
          missing = [h for h in required_headings if h not in content]
          if missing:
              print("README missing sections:", missing)
              sys.exit(1)
          print("README check passed")
          EOF
